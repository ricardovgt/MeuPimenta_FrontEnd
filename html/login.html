<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MeuPimenta</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login/login.css">
</head>
<body class="site-layout auth-page">

    <main class="container">
        <div class="logo-placeholder">MeuPimenta</div>
        
        <div id="login-feedback" class="feedback-msg hidden" aria-live="polite"></div>

        <form id="form-login">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail cadastrado" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary" id="btn-entrar">Entrar</button>
        </form>

        <div class="footer-text">
            Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="site-footer__logo">MeuPimenta</div>
        <p>Conectando pessoas, negócios e oportunidades.</p>
        <nav class="site-footer__links" aria-label="Links legais">
            <a href="legal/privacidade.html">Política de Privacidade</a>
            <a href="legal/termos.html">Termos de Conduta</a>
        </nav>
        <small>© 2026 MeuPimenta</small>
    </footer>

    <script src="../js/global.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
