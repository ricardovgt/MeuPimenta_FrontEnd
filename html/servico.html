<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Serviço - MeuPimenta</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/servicos/servicos-base.css">
    <link rel="stylesheet" href="../css/servico/servico-base.css">
    <link rel="stylesheet" href="../css/servico/servico-layout.css">
    <link rel="stylesheet" href="../css/servico/servico-card.css">
    <link rel="stylesheet" href="../css/servico/servico-modals.css">
</head>
<body>
    <header class="top-nav">
        <a href="servicos.html" class="nav-logo">MeuPimenta</a>
        <nav class="nav-links">
            <a href="servicos.html" class="nav-item">Buscar Serviços</a>
            <a href="meus_servicos.html" class="nav-item hidden" data-conta-comercial>Meus Serviços</a>
            <a href="perfil.html" class="nav-item">Perfil</a>
        </nav>
        <div class="nav-actions">
            <button id="btn-voltar" class="btn btn-outline btn-sm">← Voltar para Serviços</button>
        </div>
    </header>

    <main class="container-servico">
        <section id="servico-detalhe" class="card-servico">
            <div class="card-header-top">
                <div id="servico-postador" class="servico-dono hidden">
                    <img id="servico-postador-foto" class="servico-dono-avatar" src="../img/default-profile.png" alt="Foto do dono do serviço">
                    <div class="servico-dono-identidade">
                        <span id="servico-postador-nome" class="servico-dono-nome"></span>
                        <span class="servico-dono-tag" aria-label="Dono do serviço"><span aria-hidden="true">★</span> Dono</span>
                    </div>
                </div>
            </div>
            <div id="servico-hero" class="hero hidden">
                <button id="btn-foto-anterior" class="foto-nav-btn foto-nav-anterior hidden" type="button" aria-label="Foto anterior">‹</button>
                <img id="servico-foto" src="" alt="Foto do serviço">
                <button id="btn-foto-proxima" class="foto-nav-btn foto-nav-proxima hidden" type="button" aria-label="Próxima foto">›</button>
                <span id="foto-contador" class="foto-contador hidden"></span>
            </div>
            <div id="foto-thumbs" class="foto-thumbs hidden"></div>
            <div class="content">
                <div id="feedback-servico" class="feedback-msg hidden" aria-live="polite"></div>
                <h1 id="servico-nome">Carregando serviço...</h1>
                <p id="servico-resumo" class="resumo"></p>

                <div id="servico-badges" class="badges"></div>

                <h2 class="section-title">Descrição</h2>
                <p id="servico-descricao" class="descricao-detalhada"></p>

                <div class="actions">
                    <button id="btn-avaliar" class="btn btn-primary btn-action">
                        <span>⭐</span> Avaliar Serviço
                    </button>
                    <button id="btn-compartilhar" class="btn btn-outline btn-action">
                        <span>🔗</span> Compartilhar
                    </button>
                    <a id="servico-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-action btn-whatsapp">
                        <span>💬</span> Abrir WhatsApp
                    </a>
                </div>

                <div class="avaliacao-panel">
                    <h2 class="section-title">Avaliações</h2>
                    <div id="avaliacao-resumo" class="avaliacao-resumo">
                        <div class="resumo-score-card">
                            <span id="resumo-nota" class="resumo-nota">0.0</span>
                            <div id="resumo-estrelas" class="resumo-estrelas"></div>
                            <span id="resumo-total" class="resumo-total">0 avaliações</span>
                        </div>
                        <div class="resumo-barras-card">
                            <div class="barra-linha">
                                <span class="barra-label">5 estrelas</span>
                                <div class="barra-track"><div id="barra-fill-5" class="barra-fill" style="width: 0%"></div></div>
                                <span id="barra-count-5" class="barra-count">0</span>
                            </div>
                            <div class="barra-linha">
                                <span class="barra-label">4 estrelas</span>
                                <div class="barra-track"><div id="barra-fill-4" class="barra-fill" style="width: 0%"></div></div>
                                <span id="barra-count-4" class="barra-count">0</span>
                            </div>
                            <div class="barra-linha">
                                <span class="barra-label">3 estrelas</span>
                                <div class="barra-track"><div id="barra-fill-3" class="barra-fill" style="width: 0%"></div></div>
                                <span id="barra-count-3" class="barra-count">0</span>
                            </div>
                            <div class="barra-linha">
                                <span class="barra-label">2 estrelas</span>
                                <div class="barra-track"><div id="barra-fill-2" class="barra-fill" style="width: 0%"></div></div>
                                <span id="barra-count-2" class="barra-count">0</span>
                            </div>
                            <div class="barra-linha">
                                <span class="barra-label">1 estrela</span>
                                <div class="barra-track"><div id="barra-fill-1" class="barra-fill" style="width: 0%"></div></div>
                                <span id="barra-count-1" class="barra-count">0</span>
                            </div>
                        </div>
                    </div>
                    <div id="feedback-avaliacoes" class="feedback-msg hidden" aria-live="polite"></div>
                    <div id="avaliacoes-list" class="avaliacoes-list">
                        <!-- avaliações serão renderizadas aqui -->
                    </div>
                    <div class="avaliacoes-actions">
                        <button id="btn-carregar-mais" class="btn btn-outline btn-sm hidden">Carregar mais</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/global.js"></script>
    <script src="../js/nav-conta.js"></script>
    <script src="../js/servico/utils.js"></script>
    <script src="../js/servico/api.js"></script>
    <script src="../js/servico/ui.js"></script>
    <script src="../js/servico/events.js"></script>
    <script src="../js/servico/main.js"></script>
</body>
</html>
