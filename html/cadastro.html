<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - MeuPimenta</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/cadastro/cadastro.css">
</head>
<body>

    <main class="container container-cadastro">
        <div class="logo-placeholder">Criar Conta</div>
        
        <div id="cadastro-feedback" class="feedback-msg hidden" aria-live="polite"></div>

        <form id="form-cadastro">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Como devemos te chamar?" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" required minlength="8">
            </div>

            <div class="form-group">
                <label for="tipo_conta">Tipo de Conta</label>
                <select id="tipo_conta" name="tipo_conta" required>
                    <option value="COMUM">Conta Comum (Consumidor)</option>
                    <option value="COMERCIAL">Conta Comercial (Oferecer Serviços e outros)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" id="btn-cadastrar">Cadastrar</button>
        </form>

        <div class="footer-text">
            Já possui uma conta? <a href="login.html">Faça Login</a>
        </div>
    </main>

    <script src="../js/global.js"></script>
    <script src="../js/cadastro.js"></script>
</body>
</html>
