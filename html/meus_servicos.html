<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Serviços - MeuPimenta</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/meus_servicos/meus_servicos-base.css">
    <link rel="stylesheet" href="../css/meus_servicos/meus_servicos-cards.css">
</head>
<body>

    <header class="top-nav">
        <a href="servicos.html" class="nav-logo">MeuPimenta</a>
        <nav class="nav-links">
            <a href="servicos.html" class="nav-item">Buscar Serviços</a>
            <a href="meus_servicos.html" class="nav-item active">Meus Serviços</a>
            <a href="perfil.html" class="nav-item">Perfil</a>
        </nav>
        <div class="nav-actions">
        </div>
    </header>

    <main class="container-servicos">
        <h1>Meus Serviços</h1>
        <p>Gerencie os serviços que você oferece na plataforma.</p>

        <section id="meus-servicos-area">
            <div id="grid-meus-servicos"></div>
        </section>
    </main>

    <!-- Modal Editar Serviço -->
    <div id="modal-editar-servico" class="modal hidden">
        <div class="modal-content">
            <h2>Editar Serviço</h2>
            <form id="form-editar-servico">
                <input type="hidden" id="editar-id" name="id">
                <label>Nome do Serviço: <input type="text" id="editar-nome" name="nome" required></label>
                <label>Telefone: <input type="text" id="editar-telefone" name="telefone" required></label>
                <label>Bairro: <input type="text" id="editar-bairro" name="bairro" required></label>
                <label>URL da Foto: <input type="text" id="editar-fotoUrl" name="fotoUrl"></label>
                <label>Descrição Curta: <input type="text" id="editar-descricao" name="descricao"></label>
                <label>Descrição Detalhada: <textarea id="editar-descricaoDetalhada" name="descricaoDetalhada"></textarea></label>
                <div class="modal-actions">
                    <button type="button" id="btn-cancelar-edicao">Cancelar</button>
                    <button type="submit" id="btn-salvar-edicao">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Excluir Serviço -->
    <div id="modal-excluir-servico" class="modal hidden">
        <div class="modal-content">
            <h2>Excluir Serviço</h2>
            <p>Para confirmar a exclusão, digite seu e-mail abaixo:</p>
            <input type="hidden" id="excluir-id">
            <input type="email" id="input-email-confirmacao" placeholder="seu@email.com" required>
            <div class="modal-actions">
                <button type="button" id="btn-cancelar-excluir">Cancelar</button>
                <button type="button" id="btn-confirmar-excluir">Sim, Excluir</button>
            </div>
        </div>
    </div>

    <script src="../js/meus_servicos/api.js"></script>
    <script src="../js/meus_servicos/main.js"></script>
</body>
</html>
