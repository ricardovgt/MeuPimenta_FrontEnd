<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - MeuPimenta</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/servicos/servicos-base.css">
    <link rel="stylesheet" href="../css/servicos/servicos-layout.css">
    <link rel="stylesheet" href="../css/servicos/servicos-filtros.css">
    <link rel="stylesheet" href="../css/servicos/servicos-cards.css">
</head>
<body>

    <header class="top-nav">
        <a href="servicos.html" class="nav-logo">MeuPimenta</a>
        <nav class="nav-links">
            <a href="servicos.html" class="nav-item active">Buscar Serviços</a>
            <a href="meus_servicos.html" class="nav-item hidden" data-conta-comercial>Meus Serviços</a>
            <a href="perfil.html" class="nav-item">Perfil</a>
        </nav>
        <div class="nav-actions"></div>
    </header>

    <main class="container-servicos">
        <aside class="filtros-section" aria-labelledby="titulo-filtros">
            <div class="filtros-header">
                <div>
                    <h3 id="titulo-filtros">Filtrar Serviços</h3>
                    <p class="filtros-subtitle">Encontre o serviço ideal para você.</p>
                </div>
            </div>
            
            <form id="form-filtros" class="filtros-form">
                <div class="form-group">
                    <label for="filtro-busca">Buscar por palavra-chave</label>
                    <div class="filtros-input-wrapper">
                        <svg class="filtros-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="filtro-busca" name="busca" placeholder="O que você procura?">
                    </div>
                    <span class="filtros-hint">Ex.: eletricista, encanador, manicure...</span>
                </div>

                <div class="form-group">
                    <label class="filtros-grupo-label">Filtrar por</label>
                    <label class="rating-toggle-label" for="filtro-top">
                        <input type="checkbox" id="filtro-top" class="hidden-checkbox">
                        <div class="custom-rating-btn">
                            <span class="rating-btn-text">
                                <span class="rating-star" aria-hidden="true">⭐</span> Melhores Avaliações
                            </span>
                            <span class="rating-btn-check">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </span>
                        </div>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-filtros-buscar">Buscar</button>
                
                <div class="filtros-divider">
                    <span>ou</span>
                </div>

                <button type="button" id="btn-limpar-filtros" class="btn btn-outline btn-filtros-limpar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                    Limpar filtros
                </button>
            </form>
        </aside>

        <section class="lista-servicos">
            <h2>Serviços Disponíveis</h2>
            <div id="grid-servicos" class="grid-container">
                <p>Carregando serviços...</p>
            </div>
        </section>
    </main>

    <script src="../js/global.js"></script>
    <script src="../js/nav-conta.js"></script>
    <script src="../js/servicos/api.js"></script>
    <script src="../js/servicos/ui.js"></script>
    <script src="../js/servicos/events.js"></script>
    <script src="../js/servicos/main.js"></script>
</body>
</html>
